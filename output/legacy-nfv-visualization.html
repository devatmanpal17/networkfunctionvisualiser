}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {

  &lt;div id=&quot;simulation-status&quot; class=&quot;status text-small&quot; aria-live=&quot;polite&quot;&gt;Healthy chain · two cVNF replicas per function · packets flow client → firewall → load balancer → servers.&lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;nfv-lab-model&#x27;);
      const load = root.querySelector(&#x27;#traffic-load&#x27;);
      const autoScale = root.querySelector(&#x27;#auto-scale&#x27;);
      const failure = root.querySelector(&#x27;#failure-toggle&#x27;);
      const packetLayer = root.querySelector(&#x27;#packets&#x27;);
      let failed = false;
      let animationId = 0;
      const ns = &#x27;http://www.w3.org/2000/svg&#x27;;
      const path = [[132,275],[220,275],[324,275],[372,275],[484,275],[528,275],[640,275],[690,275],[790,275],[842,275]];

      function replicasFor(value) {
        if (!autoScale.checked) return 1;
        return value &gt;= 80 ? 4 : value &gt;= 55 ? 3 : 2;
      }

      function drawReplicas(id, count) {
        const group = root.querySelector(id);
        group.textContent = &#x27;&#x27;;
        const total = count * 13 - 3;
        for (let i = 0; i &lt; count; i++) {
          const rect = document.createElementNS(ns, &#x27;rect&#x27;);
          rect.setAttribute(&#x27;class&#x27;,&#x27;replica&#x27;); rect.setAttribute(&#x27;x&#x27;, 56 - total/2 + i*13);
          rect.setAttribute(&#x27;y&#x27;,&#x27;61&#x27;); rect.setAttribute(&#x27;width&#x27;,&#x27;10&#x27;); rect.setAttribute(&#x27;height&#x27;,&#x27;8&#x27;); rect.setAttribute(&#x27;rx&#x27;,&#x27;2&#x27;);
          group.appendChild(rect);
        }
      }

      function update() {
        const value = Number(load.value);
        const replicas = replicasFor(value);
        const effective = failed ? Math.max(1, replicas - 1) : replicas;
        const capacity = effective * 30;
        const congestion = Math.max(0, value - capacity);
        const throughput = Math.max(0.4, value * 0.092 - congestion * 0.045 - (failed ? 0.7 : 0));
        const latency = 2.4 + value * 0.035 + congestion * 0.16 + (failed ? 6.5 : 0);
        const cpu = Math.min(98, Math.round(value / effective + 24));
        root.querySelector(&#x27;#load-value&#x27;).textContent = value + &#x27;%&#x27;;
        root.querySelector(&#x27;#throughput&#x27;).textContent = throughput.toFixed(1);
        root.querySelector(&#x27;#latency&#x27;).textContent = latency.toFixed(1);
        root.querySelector(&#x27;#cpu&#x27;).textContent = cpu;
        root.querySelector(&#x27;#throughput-meter&#x27;).style.width = Math.min(100, throughput * 10) + &#x27;%&#x27;;
        root.querySelector(&#x27;#latency-meter&#x27;).style.width = Math.min(100, latency * 5) + &#x27;%&#x27;;
        root.querySelector(&#x27;#cpu-meter&#x27;).style.width = cpu + &#x27;%&#x27;;
        root.querySelector(&#x27;.throughput-progress&#x27;).setAttribute(&#x27;aria-valuenow&#x27;, throughput.toFixed(1));
        root.querySelector(&#x27;.latency-progress&#x27;).setAttribute(&#x27;aria-valuenow&#x27;, latency.toFixed(1));
        root.querySelector(&#x27;.cpu-progress&#x27;).setAttribute(&#x27;aria-valuenow&#x27;, cpu);
        root.querySelector(&#x27;#throughput-health&#x27;).textContent = throughput &gt;= 7 ? &#x27;High flow&#x27; : throughput &gt;= 3 ? &#x27;Optimal&#x27; : &#x27;Constrained&#x27;;
        root.querySelector(&#x27;#latency-health&#x27;).textContent = latency &lt; 8 ? &#x27;Nominal&#x27; : latency &lt; 15 ? &#x27;Elevated&#x27; : &#x27;SLA risk&#x27;;
        root.querySelector(&#x27;#cpu-health&#x27;).textContent = cpu &lt; 65 ? &#x27;Balanced&#x27; : cpu &lt; 85 ? &#x27;Busy&#x27; : &#x27;Saturated&#x27;;
        root.querySelector(&#x27;#compute-bar&#x27;).setAttribute(&#x27;width&#x27;, Math.round(220 * cpu / 100));
        root.querySelector(&#x27;#network-bar&#x27;).setAttribute(&#x27;width&#x27;, Math.round(220 * Math.min(96,value * .92) / 100));
        root.querySelector(&#x27;#storage-bar&#x27;).setAttribute(&#x27;width&#x27;, Math.round(220 * (24 + replicas * 4) / 100));
        drawReplicas(&#x27;#fw-replicas&#x27;, failed ? effective : replicas);
        drawReplicas(&#x27;#lb-replicas&#x27;, replicas);
        root.querySelector(&#x27;#fw-count&#x27;).textContent = (failed ? effective : replicas) + ((failed ? effective : replicas) === 1 ? &#x27; replica&#x27; : &#x27; replicas&#x27;);
        root.querySelector(&#x27;#lb-count&#x27;).textContent = replicas + (replicas === 1 ? &#x27; replica&#x27; : &#x27; replicas&#x27;);
        root.querySelector(&#x27;#firewall-node&#x27;).setAttribute(&#x27;class&#x27;, failed ? &#x27;node failed&#x27; : &#x27;node active&#x27;);
        failure.textContent = failed ? &#x27;Restore vFirewall&#x27; : &#x27;Inject vFirewall failure&#x27;;
        failure.setAttribute(&#x27;aria-pressed&#x27;, String(failed));
        const mode = autoScale.checked ? &#x27;MANO auto-scaling active&#x27; : &#x27;fixed at one replica&#x27;;
        const health = failed ? &#x27;Degraded chain · one vFirewall instance removed; traffic is rerouted through surviving capacity.&#x27; : &#x27;Healthy chain&#x27;;
        const status = root.querySelector(&#x27;#simulation-status&#x27;);
        status.textContent = health + &#x27; · &#x27; + mode + &#x27; · &#x27; + replicas + &#x27; planned replica&#x27; + (replicas === 1 ? &#x27;&#x27; : &#x27;s&#x27;) + &#x27; per function.&#x27;;
        status.classList.toggle(&#x27;degraded&#x27;, failed);
        root.querySelector(&#x27;#chain-mode&#x27;).textContent = (failed ? &#x27;DEGRADED&#x27; : (autoScale.checked ? &#x27;AUTONOMOUS&#x27; : &#x27;MANUAL&#x27;)) + &#x27; · &#x27; + replicas + &#x27; REPLICA&#x27; + (replicas === 1 ? &#x27;&#x27; : &#x27;S&#x27;);
      }

      function pointAt(t) {
        const scaled = t * (path.length - 1);
        const i = Math.min(path.length - 2, Math.floor(scaled));
        const f = scaled - i;
        return [path[i][0] + (path[i+1][0]-path[i][0])*f, path[i][1] + (path[i+1][1]-path[i][1])*f];
      }

      function animate(time) {
        const value = Number(load.value);
        const count = Math.max(2, Math.round(value / 13));
        while (packetLayer.children.length &lt; count) {
          const c = document.createElementNS(ns,&#x27;circle&#x27;); c.setAttribute(&#x27;r&#x27;,&#x27;5&#x27;); c.setAttribute(&#x27;class&#x27;,&#x27;packet&#x27;); packetLayer.appendChild(c);
        }
        while (packetLayer.children.length &gt; count) packetLayer.lastChild.remove();
        [...packetLayer.children].forEach((c,i) =&gt; {
          let t = ((time * (0.000045 + value * 0.0000005)) + i/count) % 1;
          if (failed &amp;&amp; (i % 4 === 0) &amp;&amp; t &gt; .39) t = .39;
          const p = pointAt(t); c.setAttribute(&#x27;cx&#x27;,p[0]); c.setAttribute(&#x27;cy&#x27;,p[1]);
          c.setAttribute(&#x27;class&#x27;, failed &amp;&amp; (i % 4 === 0) ? &#x27;packet blocked&#x27; : &#x27;packet&#x27;);
        });
        animationId = requestAnimationFrame(animate);
      }

      load.addEventListener(&#x27;input&#x27;,update);
      autoScale.addEventListener(&#x27;change&#x27;,update);
      failure.addEventListener(&#x27;click&#x27;,() =&gt; { failed = !failed; update(); });
      update();
      if (!matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches) animationId = requestAnimationFrame(animate);
      window.addEventListener(&#x27;pagehide&#x27;, () =&gt; cancelAnimationFrame(animationId), {once:true});
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
